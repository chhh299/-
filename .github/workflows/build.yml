name: Build Cloud Auto APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace > build_log.txt 2>&1 || (
            echo "Build failed, pushing build_log.txt to git..."
            git config user.name "chhh299"
            git config user.email "chhh299@users.noreply.github.com"
            git add build_log.txt
            git commit -m "[00001] CI 捕获实际编译报错日志[AI-chhh299.Developer]"
            git push origin main
            exit 1
          )

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v3.2.0
          name: Cloud Auto Service v3.2.0
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
