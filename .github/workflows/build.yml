name: Build Cloud Auto APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.txt

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cloud-auto-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v3.1.0
          name: Cloud Auto Service v3.1.0
          body: |
            ## 139 移动云手机 - 无障碍自动化守护 APK (局域网主动外连版)
            - 支持界面动态填写对端 IP 与端口 (支持随时切换至 OpenWrt 或 PC)
            - 启动 Client Socket 主动出站长连接，彻底解决入站防火墙与剪贴板限制
            - 断线自动 5 秒重试机制
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Failure Log to Release
        uses: softprops/action-gh-release@v2
        if: failure()
        with:
          tag_name: build-failure
          name: Build Failure Log
          body: "构建失败详细日志，供排查错误"
          files: build_output.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
