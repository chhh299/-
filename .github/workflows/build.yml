name: Build Cloud Auto APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloud-auto-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v3.1.0
          name: Cloud Auto Service v3.1.0
          body: |
            ## 139 移动云手机 - 无障碍自动化守护 APK
            - 支持 WebRTC DataChannel 剪贴板指令监听
            - 支持按文字、控件ID、坐标点击
            - 支持免输入法文本直接赋值
            - 支持全界面 UI 节点抓取并反向回传
            - 针对 Android 10+ 锁定 targetSdk 28，确保后台免断连
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
